name: Publish Daily Instagram Posts

on:
  schedule:
    # Uruchamia się codziennie o 12:00 UTC
    # Jeśli chcesz inny czas, zmień "0 12" na inną wartość
    # Np. "0 11 * * *" dla 11:00 UTC, "30 11 * * *" dla 11:30 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  publish-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Publish today's posts to Instagram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/publish-daily.js
